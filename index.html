<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RENTARA - Marketplace Sewa Barang Bekas</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">
  <!-- Header -->
  <header class="bg-slate-900 text-white p-4 sticky top-0 z-10 shadow">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide">RENTARA</h1>
        <p class="text-xs text-slate-300">Sewa Barang Bekas • Cek Fisik Sebelum Bayar</p>
      </div>
      <span id="api-status" class="text-xs bg-amber-500/20 text-amber-300 px-2 py-1 rounded-full">Menghubungkan...</span>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
      <h2 class="font-semibold text-sm text-slate-600 mb-2">Mitra Toko Terdekat (Area Purwokerto)</h2>
      <div id="vendor-list" class="space-y-3 text-sm text-slate-500">
        Memuat daftar mitra toko dari server...
      </div>
    </div>
  </main>

  <script>
    const API_BASE_URL = 'https://rentara-backend.vercel.app';

    // Daftarkan Service Worker untuk syarat APK PWABuilder
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    // Muat data mitra terdekat dari Backend Vercel
    async function loadNearbyVendors() {
      const statusEl = document.getElementById('api-status');
      const listEl = document.getElementById('vendor-list');
      try {
        const res = await fetch(`${API_BASE_URL}/api/vendors/nearby?lat=-7.4243&lng=109.2391`);
        const data = await res.json();
        statusEl.textContent = 'Server Online';
        statusEl.className = 'text-xs bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded-full';

        if (data.vendors && data.vendors.length > 0) {
          listEl.innerHTML = data.vendors.map(v => `
            <div class="p-3 border border-slate-200 rounded-lg bg-slate-50">
              <div class="font-bold text-slate-800">${v.store_name}</div>
              <div class="text-xs text-slate-500 mt-1">Jarak: ${Number(v.distance_km).toFixed(1)} km • Radius Maks: ${v.service_radius_km} km</div>
            </div>
          `).join('');
        } else {
          listEl.innerHTML = '<p>Belum ada mitra toko dalam radius lokasi Anda.</p>';
        }
      } catch (err) {
        statusEl.textContent = 'Offline';
        listEl.innerHTML = `<p class="text-red-500">Gagal memuat data: ${err.message}</p>`;
      }
    }

    loadNearbyVendors();
  </script>
</body>
</html>
